<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechShop — магазин комплектующих</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="#" class="logo">Tech<span>Shop</span></a>
    <div class="search-bar">
      <input type="text" id="search" placeholder="Поиск товаров...">
    </div>
    <div class="header-actions">
      <div id="user-avatar" class="avatar hidden"></div>
      <button id="login-btn" class="icon-btn">Войти</button>
      <button id="register-btn" class="icon-btn">Регистрация</button>
      <button id="fav-btn" class="icon-btn">❤ <span id="fav-count">0</span></button>
      <button id="cart-btn" class="icon-btn">🛒 <span id="cart-count">0</span></button>
    </div>
  </div>
  <nav class="cats">
    <div class="container cats-inner">
      <button class="cat-btn active" data-cat="all">Все</button>
      <button class="cat-btn" data-cat="cpu">Процессоры</button>
      <button class="cat-btn" data-cat="gpu">Видеокарты</button>
      <button class="cat-btn" data-cat="mb">Материнские платы</button>
      <button class="cat-btn" data-cat="ram">Память</button>
      <button class="cat-btn" data-cat="storage">Накопители</button>
    </div>
  </nav>
</header>

<section class="banner">
  <div class="container">
    <div class="banner-card">
      <h1>Комплектующие для ПК</h1>
      <p>Скидки до 30% на процессоры и видеокарты</p>
      <a href="#products" class="btn">Смотреть товары</a>
    </div>
  </div>
</section>

<main class="container" id="products">
  <div id="product-grid" class="grid"></div>
</main>

<div id="cart-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2>Корзина</h2>
      <button id="close-cart" class="close-btn">&times;</button>
    </div>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <div class="total">Итого: <span id="cart-total">0</span> лей</div>
      <button class="btn">Оформить заказ</button>
    </div>
  </div>
</div>

<div id="auth-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="auth-title">Вход</h2>
      <button id="close-auth" class="close-btn">&times;</button>
    </div>
    <form id="auth-form" autocomplete="off">
      <input type="text" id="auth-name" placeholder="Имя" style="display:none;width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r);">
      <input type="email" id="auth-email" placeholder="Email" required style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r);">
      <input type="password" id="auth-pass" placeholder="Пароль" required style="width:100%;padding:10px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--r);">
      <button type="submit" class="btn" style="width:100%">Отправить</button>
    </form>
    <p style="margin-top:10px;font-size:14px;"><a href="#" id="toggle-auth">Нет аккаунта? Регистрация</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
